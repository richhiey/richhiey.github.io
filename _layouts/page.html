---
layout: base
---
<section class="page-layout">
  {%- if page.show_title != false and page.title -%}
    <header class="page-layout__header">
      <h1 class="page-title">{{ page.title | escape }}</h1>
    </header>
  {%- endif -%}

  <div class="page-layout__content">
    {{ content }}
  </div>
</section>
