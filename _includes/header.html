<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}"><img class="site-avatar" src="{{ '/assets/images/home/home_image.jpg' | relative_url }}" alt="" width="48" height="48">{{ site.title | escape }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for path in site.header_pages %}
        {% assign nav_page = site.pages | where: 'path', path | first %}
        {% if nav_page %}
          <a class="page-link{% if page.url contains nav_page.url %} is-active{% endif %}" href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url %} aria-current="page"{% endif %}>{{ nav_page.title | escape }}</a>
        {% endif %}
      {% endfor %}
      <a class="page-link nav-resume" href="{{ '/assets/pdfs/CV-richhiey-thomas.pdf' | relative_url }}">Resume <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
