<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Pitch error in cents and metric behavior</title>
  <desc id="desc">A logarithmic cents axis shows correct, small intonation, semitone, and octave errors plus a voicing error.</desc>
  <style>.bg{fill:#10161d}.title{fill:#f3f6f8;font:700 25px system-ui,sans-serif}.body{fill:#c9d2da;font:15px system-ui,sans-serif}.small{fill:#91a0ad;font:13px system-ui,sans-serif}.axis{stroke:#738493;stroke-width:2}.tick{stroke:#536575}.good{fill:#48c6b7}.warn{fill:#f3b65b}.bad{fill:#ef6a6a}.box{fill:#18222d;stroke:#314252;stroke-width:2}</style>
  <rect class="bg" width="1120" height="470" rx="18"/>
  <text class="title" x="55" y="52">Pitch errors live on a logarithmic musical scale</text>
  <text class="small" x="55" y="78">Reference note: A4 = 440 Hz · error = 1200 log₂(f̂ / f)</text>
  <line class="axis" x1="85" y1="180" x2="1035" y2="180"/>
  <g class="small" text-anchor="middle">
    <line class="tick" x1="120" y1="165" x2="120" y2="195"/><text x="120" y="220">−1200¢</text>
    <line class="tick" x1="555" y1="155" x2="555" y2="205"/><text x="555" y="220">0¢</text>
    <line class="tick" x1="591" y1="165" x2="591" y2="195"/><text x="591" y="245">+100¢</text>
    <line class="tick" x1="990" y1="165" x2="990" y2="195"/><text x="990" y="220">+1200¢</text>
  </g>
  <circle class="good" cx="555" cy="180" r="10"/><text class="body" x="520" y="133">correct</text>
  <circle class="warn" cx="566" cy="180" r="8"/><text class="small" x="575" y="282">+30¢: small intonation error</text>
  <circle class="bad" cx="591" cy="180" r="9"/><text class="small" x="575" y="305">+100¢: one semitone</text>
  <circle class="bad" cx="990" cy="180" r="11"/><text class="body" x="913" y="133">octave error</text>
  <rect class="box" x="70" y="345" width="300" height="75" rx="10"/><text class="body" x="91" y="375">RPA penalizes octave errors</text><text class="small" x="91" y="399">when tolerance is, e.g., ±50 cents</text>
  <rect class="box" x="410" y="345" width="300" height="75" rx="10"/><text class="body" x="431" y="375">RCA ignores octave number</text><text class="small" x="431" y="399">A4 and A5 may both count as A</text>
  <rect class="box" x="750" y="345" width="300" height="75" rx="10"/><text class="body" x="771" y="375">Voicing is a separate decision</text><text class="small" x="771" y="399">no Hz error exists for “unvoiced”</text>
</svg>
