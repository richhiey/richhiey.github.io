<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Author-reported SwiftF0 benchmark results</title>
  <desc id="desc">Two bar charts show harmonic mean under 10 decibel noise and CPU processing time for SwiftF0, TorchCREPE, and pYIN as reported in the SwiftF0 paper.</desc>
  <style>
    .bg{fill:#10161d}.panel{fill:#18222d;stroke:#314252;stroke-width:2}.title{fill:#f3f6f8;font:700 25px system-ui,sans-serif}
    .head{fill:#f3f6f8;font:700 18px system-ui,sans-serif}.body{fill:#c9d2da;font:14px system-ui,sans-serif}.small{fill:#91a0ad;font:12px system-ui,sans-serif}
    .grid{stroke:#314252;stroke-width:1}.swift{fill:#48c6b7}.crepe{fill:#829cff}.yin{fill:#f3b65b}
  </style>
  <rect class="bg" width="1120" height="560" rx="18"/>
  <text class="title" x="55" y="52">What the SwiftF0 paper reports</text>
  <text class="small" x="55" y="76">Author benchmark · three held-out datasets · values are not locally reproduced</text>
  <g transform="translate(55 108)">
    <rect class="panel" width="490" height="390" rx="14"/>
    <text class="head" x="24" y="36">Harmonic mean at 10 dB SNR (%)</text>
    <text class="small" x="24" y="58">Six components; higher is better</text>
    <line class="grid" x1="72" y1="90" x2="72" y2="330"/><line class="grid" x1="72" y1="330" x2="456" y2="330"/>
    <line class="grid" x1="72" y1="210" x2="456" y2="210"/><text class="small" x="40" y="214">50</text><text class="small" x="34" y="96">100</text><text class="small" x="47" y="335">0</text>
    <rect class="swift" x="106" y="110" width="78" height="220" rx="5"/><text class="body" x="117" y="101">91.80</text><text class="small" x="116" y="355">SwiftF0</text>
    <rect class="crepe" x="234" y="141" width="78" height="189" rx="5"/><text class="body" x="246" y="132">78.97</text><text class="small" x="236" y="355">TorchCREPE</text>
    <rect class="yin" x="362" y="138" width="78" height="192" rx="5"/><text class="body" x="374" y="129">79.99</text><text class="small" x="383" y="355">pYIN</text>
  </g>
  <g transform="translate(575 108)">
    <rect class="panel" width="490" height="390" rx="14"/>
    <text class="head" x="24" y="36">CPU time for 5 seconds of audio (ms)</text>
    <text class="small" x="24" y="58">Paper setup; lower is better · log₁₀ axis</text>
    <line class="grid" x1="72" y1="90" x2="72" y2="330"/><line class="grid" x1="72" y1="330" x2="456" y2="330"/>
    <line class="grid" x1="72" y1="250" x2="456" y2="250"/><line class="grid" x1="72" y1="170" x2="456" y2="170"/><line class="grid" x1="72" y1="90" x2="456" y2="90"/>
    <text class="small" x="30" y="335">10</text><text class="small" x="23" y="255">100</text><text class="small" x="16" y="175">1k</text><text class="small" x="10" y="95">10k</text>
    <rect class="swift" x="106" y="240" width="78" height="90" rx="5"/><text class="body" x="118" y="231">132.6</text><text class="small" x="116" y="355">SwiftF0</text>
    <rect class="crepe" x="234" y="111" width="78" height="219" rx="5"/><text class="body" x="241" y="102">5508.3</text><text class="small" x="236" y="355">TorchCREPE</text>
    <rect class="yin" x="362" y="158" width="78" height="172" rx="5"/><text class="body" x="369" y="149">1420.6</text><text class="small" x="383" y="355">pYIN</text>
  </g>
  <text class="small" x="55" y="530">Source: Nieradzik (2025), Tables 1 and 3. “CREPE” in that benchmark is TorchCREPE; pYIN is probabilistic YIN, not plain YIN.</text>
</svg>
