<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Fair benchmark protocol</title>
  <desc id="desc">A flow diagram sends shared audio into three detectors, aligns timestamps, and produces separate accuracy and runtime reports.</desc>
  <style>.bg{fill:#10161d}.box{fill:#18222d;stroke:#314252;stroke-width:2}.accent{fill:#142b2b;stroke:#48c6b7}.title{fill:#f3f6f8;font:700 25px system-ui,sans-serif}.head{fill:#f3f6f8;font:700 17px system-ui,sans-serif}.body{fill:#c9d2da;font:14px system-ui,sans-serif}.small{fill:#91a0ad;font:12px system-ui,sans-serif}.line{fill:none;stroke:#738493;stroke-width:2}</style>
  <rect class="bg" width="1120" height="500" rx="18"/>
  <text class="title" x="55" y="50">A comparison is fair only when the boundaries are shared</text>
  <rect class="box accent" x="55" y="90" width="230" height="90" rx="12"/><text class="head" x="77" y="122">One labelled audio set</text><text class="body" x="77" y="147">mono · common 16 kHz copy</text><text class="small" x="77" y="166">fixed split and noise protocol</text>
  <path class="line" d="M285 135h95"/><path fill="#738493" d="m372 129 12 6-12 6z"/>
  <g>
    <rect class="box" x="385" y="70" width="200" height="70" rx="10"/><text class="head" x="410" y="100">SwiftF0</text><text class="small" x="410" y="122">pinned model + threshold</text>
    <rect class="box" x="385" y="155" width="200" height="70" rx="10"/><text class="head" x="410" y="185">CREPE-full</text><text class="small" x="410" y="207">capacity + centering fixed</text>
    <rect class="box" x="385" y="240" width="200" height="70" rx="10"/><text class="head" x="410" y="270">librosa YIN</text><text class="small" x="410" y="292">frame + hop + range fixed</text>
  </g>
  <path class="line" d="M585 105h90v105h55M585 190h145M585 275h90v-65h55"/><path fill="#738493" d="m722 204 12 6-12 6z"/>
  <rect class="box accent" x="735" y="165" width="300" height="90" rx="12"/><text class="head" x="759" y="197">Timestamp alignment</text><text class="body" x="759" y="222">never compare frame arrays by index</text><text class="small" x="759" y="242">voicing policy fixed before test</text>
  <path class="line" d="M885 255v62M885 317H305v37M885 317v37"/><path fill="#738493" d="m299 346 6 12 6-12z"/><path fill="#738493" d="m879 346 6 12 6-12z"/>
  <rect class="box" x="145" y="360" width="320" height="95" rx="12"/><text class="head" x="169" y="391">Accuracy report</text><text class="body" x="169" y="416">voicing P/R/F1 · RPA · RCA</text><text class="small" x="169" y="439">cents distribution · octave/gross errors</text>
  <rect class="box" x="725" y="360" width="320" height="95" rx="12"/><text class="head" x="749" y="391">Runtime report</text><text class="body" x="749" y="416">cold start · warm median · p95</text><text class="small" x="749" y="439">same machine · threads · timing scope</text>
</svg>
