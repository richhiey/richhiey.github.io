<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">SwiftF0, CREPE, and YIN architecture comparison</title>
  <desc id="desc">Three parallel signal paths compare spectral neural, waveform neural, and periodicity based pitch detection.</desc>
  <style>
    .bg{fill:#10161d}.panel{fill:#18222d;stroke:#314252;stroke-width:2}.swift{stroke:#48c6b7}.crepe{stroke:#829cff}.yin{stroke:#f3b65b}
    .title{fill:#f3f6f8;font:700 25px system-ui,sans-serif}.head{fill:#f3f6f8;font:700 21px system-ui,sans-serif}
    .body{fill:#c9d2da;font:15px system-ui,sans-serif}.small{fill:#91a0ad;font:13px system-ui,sans-serif}.arrow{fill:none;stroke:#91a0ad;stroke-width:2}
  </style>
  <rect class="bg" width="1120" height="620" rx="18"/>
  <text class="title" x="55" y="52">Three ways to estimate one fundamental frequency</text>
  <text class="small" x="55" y="78">Same monophonic waveform; different representations, estimators, and confidence semantics</text>
  <g transform="translate(45 110)">
    <rect class="panel swift" width="320" height="440" rx="14"/>
    <text class="head" x="24" y="42">SwiftF0</text><text class="small" x="24" y="66">learned · frequency domain</text>
    <rect class="panel" x="24" y="94" width="272" height="52" rx="8"/><text class="body" x="52" y="126">16 kHz mono waveform</text>
    <path class="arrow" d="M160 146v31"/><path fill="#91a0ad" d="m154 171 6 10 6-10z"/>
    <rect class="panel" x="24" y="181" width="272" height="67" rx="8"/><text class="body" x="49" y="209">STFT + log magnitude</text><text class="small" x="49" y="231">selected spectral band</text>
    <path class="arrow" d="M160 248v31"/><path fill="#91a0ad" d="m154 273 6 10 6-10z"/>
    <rect class="panel" x="24" y="283" width="272" height="67" rx="8"/><text class="body" x="79" y="311">compact 2-D CNN</text><text class="small" x="72" y="333">log-spaced pitch bins</text>
    <path class="arrow" d="M160 350v31"/><path fill="#91a0ad" d="m154 375 6 10 6-10z"/>
    <text class="body" x="61" y="407">local expected value</text><text class="small" x="73" y="430">F0 + model confidence</text>
  </g>
  <g transform="translate(400 110)">
    <rect class="panel crepe" width="320" height="440" rx="14"/>
    <text class="head" x="24" y="42">CREPE</text><text class="small" x="24" y="66">learned · time domain</text>
    <rect class="panel" x="24" y="94" width="272" height="52" rx="8"/><text class="body" x="52" y="126">16 kHz mono waveform</text>
    <path class="arrow" d="M160 146v31"/><path fill="#91a0ad" d="m154 171 6 10 6-10z"/>
    <rect class="panel" x="24" y="181" width="272" height="67" rx="8"/><text class="body" x="64" y="209">1,024 raw samples</text><text class="small" x="74" y="231">per-frame normalization</text>
    <path class="arrow" d="M160 248v31"/><path fill="#91a0ad" d="m154 273 6 10 6-10z"/>
    <rect class="panel" x="24" y="283" width="272" height="67" rx="8"/><text class="body" x="65" y="311">six-layer 1-D CNN</text><text class="small" x="57" y="333">360 bins × 20 cents</text>
    <path class="arrow" d="M160 350v31"/><path fill="#91a0ad" d="m154 375 6 10 6-10z"/>
    <text class="body" x="61" y="407">local weighted average</text><text class="small" x="65" y="430">F0 + max activation</text>
  </g>
  <g transform="translate(755 110)">
    <rect class="panel yin" width="320" height="440" rx="14"/>
    <text class="head" x="24" y="42">YIN</text><text class="small" x="24" y="66">algorithmic · time domain</text>
    <rect class="panel" x="24" y="94" width="272" height="52" rx="8"/><text class="body" x="52" y="126">mono waveform frame</text>
    <path class="arrow" d="M160 146v31"/><path fill="#91a0ad" d="m154 171 6 10 6-10z"/>
    <rect class="panel" x="24" y="181" width="272" height="67" rx="8"/><text class="body" x="55" y="209">squared difference d(τ)</text><text class="small" x="61" y="231">compare delayed copies</text>
    <path class="arrow" d="M160 248v31"/><path fill="#91a0ad" d="m154 273 6 10 6-10z"/>
    <rect class="panel" x="24" y="283" width="272" height="67" rx="8"/><text class="body" x="49" y="311">cumulative normalization</text><text class="small" x="64" y="333">threshold + minimum</text>
    <path class="arrow" d="M160 350v31"/><path fill="#91a0ad" d="m154 375 6 10 6-10z"/>
    <text class="body" x="66" y="407">parabolic interpolation</text><text class="small" x="64" y="430">F0 + periodicity score</text>
  </g>
  <text class="small" x="55" y="586">Mechanisms are not rankings: evaluation requires common data, timestamps, voicing policy, and timing boundaries.</text>
</svg>
