<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">SwiftF0 network tensor flow</title><desc id="desc">Five same-padded convolutional stages transform time by 132 spectral input into features and then project to 200 logarithmic pitch bins.</desc>
  <style>.bg{fill:#10161d}.box{fill:#18222d;stroke:#314252;stroke-width:2}.a{stroke:#48c6b7}.b{stroke:#829cff}.title{fill:#f3f6f8;font:700 25px system-ui,sans-serif}.head{fill:#f3f6f8;font:700 15px system-ui,sans-serif}.body{fill:#91a0ad;font:12px system-ui,sans-serif}.arrow{stroke:#738493;stroke-width:2}</style>
  <rect class="bg" width="1120" height="520" rx="18"/><text class="title" x="50" y="54">Same spatial axes, changing feature channels</text>
  <g transform="translate(48 130)">
    <rect class="box a" width="130" height="190" rx="12"/><text class="head" x="18" y="34">Input</text><text class="body" x="18" y="62">T × 132 × 1</text><text class="body" x="18" y="92">log magnitude</text>
    <path class="arrow" d="M130 95h25"/>
    <rect class="box" x="155" y="15" width="130" height="175" rx="12"/><text class="head" x="173" y="49">Conv 1</text><text class="body" x="173" y="75">5×5 · 8 ch</text><text class="body" x="173" y="101">BN + ReLU</text><text class="body" x="173" y="139">T × 132 × 8</text>
    <path class="arrow" d="M285 103h25"/>
    <rect class="box" x="310" y="30" width="130" height="160" rx="12"/><text class="head" x="328" y="64">Conv 2</text><text class="body" x="328" y="90">5×5 · 16 ch</text><text class="body" x="328" y="128">T × 132 × 16</text>
    <path class="arrow" d="M440 110h25"/>
    <rect class="box" x="465" y="45" width="130" height="145" rx="12"/><text class="head" x="483" y="79">Conv 3</text><text class="body" x="483" y="105">5×5 · 32 ch</text><text class="body" x="483" y="143">T × 132 × 32</text>
    <path class="arrow" d="M595 118h25"/>
    <rect class="box" x="620" y="60" width="130" height="130" rx="12"/><text class="head" x="638" y="94">Conv 4</text><text class="body" x="638" y="120">5×5 · 64 ch</text><text class="body" x="638" y="158">T × 132 × 64</text>
    <path class="arrow" d="M750 125h25"/>
    <rect class="box" x="775" y="75" width="115" height="115" rx="12"/><text class="head" x="793" y="109">Conv 5</text><text class="body" x="793" y="135">5×5 · 1 ch</text><text class="body" x="793" y="165">T × 132</text>
    <path class="arrow" d="M890 133h25"/>
    <rect class="box b" x="915" y="65" width="115" height="125" rx="12"/><text class="head" x="933" y="99">1-D projection</text><text class="body" x="933" y="125">132 → 200</text><text class="body" x="933" y="151">log-pitch axis</text><text class="body" x="933" y="175">T × 200</text>
  </g>
  <text class="body" x="50" y="375">All 2-D convolutions use stride 1 and same padding. Five layers produce a 21 × 21 receptive field.</text>
  <text class="body" x="50" y="402">T is the number of analysis frames. The network is fully convolutional along time, so T varies with input duration.</text>
  <rect class="box a" x="50" y="435" width="1020" height="48" rx="10"/><text class="head" x="75" y="465">Reported total: 95,842 parameters</text><text class="body" x="345" y="465">The projection changes coordinate systems: linear spectral frequency → logarithmic pitch.</text>
</svg>
